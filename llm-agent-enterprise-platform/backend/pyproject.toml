[tool.poetry]
name = "llm-agent-enterprise-platform"
version = "1.0.0"
description = "Enterprise Autonomous Multi-Database LLM Agent Platform"
authors = ["DeepMind Agentic Engineering <contact@enterprise.ai>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.28"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
qdrant-client = "^1.8.2"
redis = "^5.0.3"
motor = "^3.3.2"
beanie = "^1.25.0"
aioboto3 = "^12.3.0"
boto3 = "^1.34.69"
clickhouse-connect = "^0.7.6"
openai = "^1.14.2"
anthropic = "^0.19.1"
tiktoken = "^0.6.0"
sympy = "^1.12"
httpx = "^0.27.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
sse-starlette = "^2.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
